<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1">
<title>OneTo</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-bm" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-bmf" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" fill="currentColor"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></symbol>
  <symbol id="i-rows" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="4" rx="1.5"/><rect x="4" y="10.5" width="16" height="4" rx="1.5"/><rect x="4" y="16" width="16" height="4" rx="1.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.1M4.5 12h.1M4.5 17h.1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v4h-4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l.8 12h8.4L17 7"/></symbol>
  <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.3v.2"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8a1 1 0 0 0-1.5.86z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.4"/></symbol>
  <!-- group icons -->
  <symbol id="g-news" viewBox="0 0 24 24"><rect x="3.5" y="5" width="13" height="14" rx="2"/><path d="M16.5 9h3a1 1 0 0 1 1 1v7a2 2 0 0 1-2 2h-2M7 9h6M7 12.5h6M7 16h4"/></symbol>
  <symbol id="g-sport" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l3.6 2.6-1.4 4.2H9.8l-1.4-4.2zM12 3.5v4M20.2 9.6l-4.6.5M17 19l-2.8-4.7M7 19l2.8-4.7M3.8 9.6l4.6.5"/></symbol>
  <symbol id="g-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M7.5 5v14M16.5 5v14M3.5 9.5h4M3.5 14.5h4M16.5 9.5h4M16.5 14.5h4"/></symbol>
  <symbol id="g-kids" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.1M15 9.5h.1"/></symbol>
  <symbol id="g-music" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
  <symbol id="g-doc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
  <symbol id="g-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z"/></symbol>
  <symbol id="g-series" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M10 9.5v5l4-2.5z"/><path d="M8 3.5l4 2.5 4-2.5"/></symbol>
  <symbol id="g-radio" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="11" rx="2"/><circle cx="15.5" cy="13.5" r="2.5"/><path d="M7 12h3M7 15h3M6 8l11-4"/></symbol>
  <symbol id="g-star" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4.1-4 5.7-.8z"/></symbol>
  <symbol id="g-all" viewBox="0 0 24 24"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/></symbol>
</svg>

<div id="app">
  <div id="bgwash"></div>
  <nav id="side">
    <div class="brand"><span class="mark"></span></div>
    <div id="side-main"></div>
    <div id="side-foot"></div>
  </nav>
  <aside id="groups"><div class="gp-h">Groups</div><div id="gp-list" class="scroll" data-mv="120"></div></aside>
  <main id="main">
    <div id="view" class="scroll" data-mv="140"></div>
    <aside id="peek">
      <div class="pk-screen"><video id="pkv" playsinline></video><div class="pk-logo"></div><span class="pk-live"><i></i>LIVE</span></div>
      <div class="pk-body">
        <div class="pk-no tab"></div>
        <div class="pk-name"></div>
        <div class="pk-grp"></div>
        <div class="pk-btns"></div>
        <div class="pk-hint">OK to watch</div>
      </div>
      <div class="pk-empty">Select a channel to preview it</div>
    </aside>
    <div id="h-clock" class="tab"></div>
  </main>
</div>

<div id="player" class="hidden">
  <video id="video" playsinline></video>
  <div id="p-spin" class="hidden"><i></i></div>
  <div id="p-err" class="hidden"><svg class="ico"><use href="#i-warn"/></svg><div class="t1">Stream unavailable</div><div class="t2"></div></div>
  <div id="p-num" class="hidden"></div>
  <div id="osd">
    <div class="shade"></div>
    <div class="osd-card glass">
      <div class="osd-logo"></div>
      <div class="osd-tx">
        <div class="osd-row"><span class="live"><i></i>LIVE</span><span class="osd-no tab"></span><span class="osd-q"></span></div>
        <div class="osd-name"></div>
        <div class="osd-grp"></div>
      </div>
      <div class="osd-btns"></div>
      <div class="osd-clock tab"></div>
    </div>
  </div>
  <div id="zap" class="glass">
    <div class="z-rail scroll" data-mv="120"></div>
    <div class="z-main">
      <div class="z-tabs"></div>
      <div class="z-title"></div>
      <div class="z-list scroll" data-mv="170"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="js/lib/webOSTV.js"></script>
<script src="js/lib/hls.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/m3u.js"></script>
<script src="js/data.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
